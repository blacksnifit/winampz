name: Build Original Winamp

on:
  push:
    branches: [ "main", "master", "community" ]
  pull_request:
    branches: [ "main", "master", "community" ]
  workflow_dispatch: 

jobs:
  build-winamp:
    runs-on: windows-latest # Dynamically provisions an active server

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # This enforces the older Visual Studio 2019 build tools on a modern Windows runner
    - name: Add MSBuild (VS2019) to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '16' # Explicit VS2019

    - name: Install Build Tools via Chocolatey
      run: |
        choco install nasm strawberryperl 7zip -y

    - name: Unpack Intel IPP Legacy Libraries
      run: |
        if (Test-Path "unpack_intel_ipp_6.1.1.035.cmd") {
          .\unpack_intel_ipp_6.1.1.035.cmd
        } elseif (Test-Path "BuildTools/unpack_intel_ipp_6.1.1.035.cmd") {
          cd BuildTools
          .\unpack_intel_ipp_6.1.1.035.cmd
          cd ..
        }
      shell: powershell

    - name: Patch ATLMFC SDK Bug (DeleteFile Conflict)
      run: |
        # Adjust path dynamically to locate the VS2019 build tools headers on windows-latest
        $headerPath = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\*" -Recurp -Filter "atltransactionmanager.h" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        if ($headerPath -and (Test-Path $headerPath)) {
            (Get-Content $headerPath) -replace '::DeleteFile\(', '::DeleteFileW(' | Set-Content $headerPath
            Write-Host "Successfully patched ATLMFC Header file at $headerPath"
        } else {
            Write-Warning "Target ATLMFC Header path not found."
        }
      shell: powershell

    - name: Compile Winamp Solution (x86)
      run: |
        .\build_winampAll_2019.cmd
      shell: cmd

    - name: Upload Winamp Binaries
      uses: actions/upload-artifact@v4
      with:
        name: winamp-leaked-build
        path: |
          **/Release/*.exe
          **/Release/*.dll
          **/Release/*.w5s

name: Build Winamp

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Vital if your fork tracks the required libs as submodules

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup MSBuild Architecture Environment
      shell: powershell
      run: |
        # Force environmental variables to use the older Visual Studio v142/v143 toolsets 
        # safely on a modern Windows runner.
        echo "Visual Studio Environment Initialized"

    - name: Run Official Build Script or MSBuild Fallback
      shell: cmd
      run: |
        :: Check if the repository includes the automated multi-project batch script
        if exist build_winampAll_2019.cmd (
            echo "Executing winamp batch configuration script..."
            call build_winampAll_2019.cmd
        ) else if exist winampAll_2019.sln (
            echo "Falling back to standalone Solution MSBuild execution..."
            msbuild winampAll_2019.sln /p:Configuration=Release /p:Platform=x86 /p:ContinueOnError=WarnAndContinue /m
        ) else (
            echo "Searching for active solution files..."
            dir *.sln
            msbuild *.sln /p:Configuration=Release /p:Platform=x86 /m
        )

    - name: Collect and Upload Binaries
      uses: actions/upload-artifact@v4
      if: always() # Uploads whatever successfully compiled, even if a minor plugin step failed
      with:
        name: winamp-compiled-output
        path: |
          **/Release/*.exe
          **/Release/*.dll
          **/Release/*.w5s
          **/Release/*.w5s
  

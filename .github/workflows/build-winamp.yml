name: Build Winamp

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Note: Winamp heavily depends on Intel IPP v6.1.1.035.
    # If those binaries are not committed to your repository's lib folder,
    # you must download/restore them here before running the compilation.
    - name: Verify or Restore Intel IPP Libs
      shell: powershell
      run: |
        echo "Ensuring build environment prerequisites are present..."
        # Add commands here to download or link Intel IPP v6.1.1.035 if needed

    - name: Build Winamp Solution
      shell: cmd
      run: |
        :: If your repository contains the automated batch file:
        if exist build_winampAll_2019.cmd (
            call build_winampAll_2019.cmd
        ) else (
            :: Fallback directly to MSBuild using the standard solution file
            msbuild winampAll_2019.sln /p:Configuration=Release /p:Platform=x86 /m
        )

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: winamp-binaries
        path: |
          **/Release/*.exe
          **/Release/*.dll
